<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>DeepSeek mock page</title>
  </head>
  <body>
    <main>
      <h1>mock chat.deepseek.com</h1>
      <p>e2e only: seeds DeepSeek's own message cache so the extension can sync it.</p>
    </main>

    <script>
      // 按真实页面采集结果构造：库 deepseek-chat / v1，对象仓 history-message（out-of-line key）。
      var DB_NAME = 'deepseek-chat';
      var STORE = 'history-message';
      var SESSION_ID = 'conv-e2e-1';
      var NOW_SECONDS = 1_794_636_911.125;

      function seed() {
        return new Promise(function (resolve, reject) {
          var request = indexedDB.open(DB_NAME, 1);
          request.onupgradeneeded = function () {
            request.result.createObjectStore(STORE);
          };
          request.onsuccess = function () {
            var db = request.result;
            var tx = db.transaction(STORE, 'readwrite');
            tx.objectStore(STORE).put(
              {
                key: SESSION_ID,
                version: 4,
                frontendVersion: 'fv-6',
                timestamp: NOW_SECONDS * 1000,
                cacheResetAt: NOW_SECONDS,
                data: {
                  chat_session: {
                    id: SESSION_ID,
                    title: '中文分词方案',
                    title_type: 'SYSTEM',
                    updated_at: NOW_SECONDS + 220,
                    inserted_at: NOW_SECONDS,
                    is_empty: false,
                  },
                  chat_messages: [
                    {
                      message_id: 1,
                      role: 'USER',
                      inserted_at: NOW_SECONDS + 39,
                      fragments: [{ type: 'REQUEST', content: '游标该怎么推进？' }],
                    },
                    {
                      message_id: 2,
                      role: 'ASSISTANT',
                      inserted_at: NOW_SECONDS + 50,
                      fragments: [
                        { type: 'THINK', content: '先确认幂等性' },
                        { type: 'TOOL_SEARCH', content: '搜索到 26 个网页' },
                        { type: 'RESPONSE', content: '游标推进要保守，失败后必须能重试。' },
                      ],
                    },
                  ],
                },
              },
              SESSION_ID,
            );
            tx.oncomplete = function () {
              db.close();
              resolve();
            };
            tx.onerror = function () {
              reject(tx.error);
            };
          };
          request.onerror = function () {
            reject(request.error);
          };
        });
      }

      seed()
        .then(function () {
          window.__deckSeedDone = true;
        })
        .catch(function (error) {
          window.__deckSeedError = String(error);
          window.__deckSeedDone = true;
        });
    </script>
  </body>
</html>
