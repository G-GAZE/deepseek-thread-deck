<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>DeepSeek mock page</title>
  </head>
  <body>
    <main>
      <h1>mock chat.deepseek.com</h1>
      <p>e2e only: waits for the extension to create its IndexedDB, then seeds rows.</p>
    </main>

    <script>
      // 扩展用 Dexie，实际 IndexedDB 版本号是「声明版本 × 10」（v2 → 20）。
      // 因此这里**不指定版本**，先等扩展建库，再用当前版本写入数据。
      var DB_NAME = 'deepseek-thread-deck';
      var NOW = Date.UTC(2026, 10, 15, 4, 0, 0);

      function openCurrentDb() {
        return new Promise(function (resolve, reject) {
          var request = indexedDB.open(DB_NAME);
          request.onsuccess = function () {
            resolve(request.result);
          };
          request.onerror = function () {
            reject(request.error);
          };
        });
      }

      function putAll(db, storeName, rows) {
        return new Promise(function (resolve, reject) {
          var tx = db.transaction(storeName, 'readwrite');
          var store = tx.objectStore(storeName);
          rows.forEach(function (row) {
            store.put(row);
          });
          tx.oncomplete = function () {
            resolve();
          };
          tx.onerror = function () {
            reject(tx.error);
          };
        });
      }

      (async function () {
        var ready = false;
        for (var attempt = 0; attempt < 150 && !ready; attempt += 1) {
          var databases = await indexedDB.databases();
          ready = databases.some(function (entry) {
            return entry.name === DB_NAME;
          });
          if (!ready)
            await new Promise(function (resolve) {
              setTimeout(resolve, 100);
            });
        }
        if (!ready) throw new Error('extension did not create the database in time');

        var db = await openCurrentDb();
        await putAll(db, 'conversation', [
          {
            id: 'conv-1',
            remoteId: 'conv-1',
            title: '中文分词方案',
            projectId: null,
            tags: [],
            createdAt: NOW,
            updatedAt: NOW,
          },
        ]);
        await putAll(db, 'message', [
          {
            id: 'conv-1:m-1',
            convId: 'conv-1',
            role: 'assistant',
            content: '游标推进要保守，失败后必须能重试。',
            order: 0,
            attachmentMeta: [],
          },
        ]);
        db.close();
        window.__deckSeedDone = true;
      })().catch(function (error) {
        window.__deckSeedError = String(error);
        window.__deckSeedDone = true;
      });
    </script>
  </body>
</html>
